name: Nimzo evaluation
description: Evaluates a pull request's Terraform changes, or a Terraform plan, against Nimzo policies, on the job's check and in one pull request comment.
author: Nimzo

inputs:
  nimzo-url:
    description: URL of Nimzo, without a path. The CLI calls the API under it, and the policy links in the comment and annotations point at it.
    default: https://staging.nimzo.dev
  nimzo-token:
    # Not `required`: a fork's pull request gets an empty secret, and the action then says why it cannot evaluate it.
    description: Organization API key (ak_…) the Nimzo CLI sends to the governance API, created by an Admin in Nimzo under Settings → API keys. Required.
  github-token:
    description: Token that lists the pull request's changed files, downloads the Nimzo CLI from GitHub Packages, writes the pull request comment, and finds the job's check run among the workflow run's jobs to write the verdict on it.
    default: ${{ github.token }}
  nimzo-version:
    description: Version of the Nimzo CLI to download from ghcr.io/getnimzo/nimzo-cli, a tag or the digest of its manifest.
    default: latest
  enable-comments:
    description: Whether to write one review comment per finding of the changed files under Files changed, with the policy, a prompt for an AI assistant and the suggested fixes the diff shows, a single one applied in one click. The findings then get no annotation. The summary comment is written either way.
    default: "false"
  enable-annotations:
    description: Whether to annotate each finding on its line on the job's check, and in the job when it has no location; ignored when enable-comments is true, which comments on the findings instead. Evaluation errors and skipped folders are annotated either way.
    default: "true"
  plan-file:
    description: Terraform plan JSON to evaluate instead of the changed folders, relative to the workspace, written into its stack folder (terraform show -json plan.out > <stack>/plan.json). The Terraform files of that folder are sent with it, so each finding points at its code; a plan with no .tf file next to it fails the step. Unset, the changed folders are evaluated.
  environment:
    description: Name of the environment of the stack to evaluate, as Nimzo shows it, such as prod. Its variables file is loaded, and the policy parameters of that environment apply. A stack with no environment of that name is skipped.
  timeout:
    description: How many seconds the Nimzo CLI waits for each folder's evaluation, the suggestion of its fixes included, which can take up to 15 minutes. Unset, the CLI's own default applies (300).

outputs:
  verdict:
    description: The verdict as JSON, with the check conclusion, each folder's Nimzo task, and every open finding with its severity, remediation, file and line, as described in the README.

runs:
  using: node24
  main: dist/index.cjs
